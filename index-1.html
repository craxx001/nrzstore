<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRZ STORE</title>
<style>
:root{--accent:#7c5cff;--card:rgba(255,255,255,.09);--border:rgba(255,255,255,.18);--text:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 15% 10%,#24356b 0,#0b1020 35%,#05070d 100%);color:var(--text);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.04),transparent 35%,rgba(124,92,255,.06));}
header{position:sticky;top:0;z-index:10;padding:15px 4%;display:flex;align-items:center;justify-content:space-between;background:rgba(7,10,20,.58);backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px}.brand img{width:40px;height:40px;border-radius:12px;object-fit:cover;display:none}
.actions{display:flex;gap:8px;align-items:center}.btn,.pill{border:1px solid var(--border);background:rgba(255,255,255,.09);color:#fff;border-radius:14px;padding:10px 14px;cursor:pointer;backdrop-filter:blur(12px)}.btn:hover{background:rgba(255,255,255,.16)}
.balance{font-weight:800;color:#b9a9ff}.menu{font-size:21px;padding:8px 12px}.hero{padding:55px 5% 25px;text-align:center}.hero h1{font-size:clamp(36px,7vw,70px);margin:0;background:linear-gradient(90deg,#fff,#a995ff,#72e7ff);-webkit-background-clip:text;color:transparent}.hero p{opacity:.7}
.grid{width:min(1200px,92%);margin:25px auto 70px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{position:relative;overflow:hidden;padding:20px;border-radius:26px;background:var(--card);border:1px solid var(--border);box-shadow:0 18px 50px #0004;backdrop-filter:blur(24px)}.card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-80px;top:-80px;background:var(--accent);filter:blur(70px);opacity:.18}
.banner{width:100%;max-height:180px;object-fit:cover;border-radius:18px;margin-bottom:14px}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;margin-bottom:14px}
.prodHead{display:flex;gap:13px;align-items:center}.logo{width:58px;height:58px;object-fit:cover;border-radius:16px;border:1px solid var(--border)}.name{font-weight:900;font-size:22px}.sub{font-size:.4em;opacity:.6;margin-top:4px;font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.pill{font-size:12px;padding:6px 9px;border-radius:999px}
.plan{display:flex;justify-content:space-between;align-items:center;padding:13px;margin:8px 0;border:1px solid var(--border);border-radius:16px;background:rgba(0,0,0,.13)}.price{font-weight:900}.buy{width:100%;margin-top:10px;background:linear-gradient(135deg,var(--accent),#42d7ff);border:0;font-weight:900}
.modal{position:fixed;inset:0;z-index:30;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}.box{width:min(460px,100%);padding:22px;border-radius:28px;background:rgba(14,18,32,.88);border:1px solid var(--border);backdrop-filter:blur(30px);box-shadow:0 30px 90px #0009}.top{display:flex;justify-content:space-between;align-items:center}.close{font-size:24px;cursor:pointer}.input{width:100%;padding:13px;margin:8px 0;border-radius:14px;border:1px solid var(--border);background:#ffffff0d;color:#fff;outline:none}.coupon{display:flex;gap:8px}.coupon .input{margin:0}.row{display:flex;justify-content:space-between;margin:10px 0}.total{font-size:24px;font-weight:900}.notice{padding:10px;border-radius:12px;background:#ffffff0b;font-size:13px;opacity:.8}
footer{text-align:center;opacity:.5;padding:30px}
</style>
</head>
<body>
<header><div class="brand"><img id="siteLogo"><span id="siteName">NRZ STORE</span></div><div class="actions" id="actions"></div></header>
<section class="hero"><h1>NRZ STORE</h1><p>Premium Free Fire services • Fast • Secure • Modern</p></section>
<main class="grid" id="products"></main><footer>© NRZ STORE • Digital products & services</footer>

<div class="modal" id="authModal"><div class="box"><div class="top"><h2 id="authTitle">Sign In</h2><span class="close" onclick="hide('authModal')">×</span></div><input id="email" class="input" placeholder="Email"><input id="pass" type="password" class="input" placeholder="Password"><button class="btn buy" onclick="auth()">Continue</button><p style="text-align:center"><a href="#" onclick="toggleAuth();return false" id="authSwitch">Create a new account</a></p></div></div>

<div class="modal" id="checkout"><div class="box"><div class="top"><h2>Checkout</h2><span class="close" onclick="hide('checkout')">×</span></div><div id="checkoutInfo"></div><div class="coupon"><input id="coupon" class="input" placeholder="Discount coupon"><button class="btn" onclick="applyCoupon()">Apply</button></div><div class="row"><span>Subtotal</span><b id="subtotal">₹0</b></div><div class="row"><span>Discount</span><b id="discount">₹0</b></div><div class="row total"><span>Total</span><span id="total">₹0</span></div><div id="walletPay"></div><button class="btn buy" id="gatewayBtn">Buy Now</button><p class="notice">Payment status is confirmed by your payment gateway. Never share passwords or OTPs.</p></div></div>

<script>
const DEFAULT={name:"NRZ STORE",logo:"",accent:"#7c5cff",border:"rgba(255,255,255,.18)",zapPayUrl:"",products:[
{name:"FF Likes",subtitle:"Fast & reliable",logo:"",banner:"",youtube:"",pills:["Instant","Safe","24/7"],plans:[{name:"100 Likes",price:10},{name:"500 Likes",price:40},{name:"1000 Likes",price:70}]},
{name:"FF Diamonds",subtitle:"Top-up service",logo:"",banner:"",youtube:"",pills:["Fast Delivery","Secure"],plans:[{name:"100💎",price:85},{name:"310💎",price:250},{name:"520💎",price:410}]}
],coupons:[{code:"NRZ10",type:"percent",value:10}],walletOptions:[5,20,50,100,250,500,1000]};
function cfg(){try{return JSON.parse(localStorage.getItem("nrz_config"))||DEFAULT}catch(e){return DEFAULT}}
function saveUser(u){localStorage.setItem("nrz_user",JSON.stringify(u))}
function user(){try{return JSON.parse(localStorage.getItem("nrz_user"))}catch(e){return null}}
function init(){let c=cfg();document.documentElement.style.setProperty("--accent",c.accent);document.documentElement.style.setProperty("--border",c.border);siteName.textContent=c.name;document.querySelector(".hero h1").textContent=c.name;if(c.logo){siteLogo.src=c.logo;siteLogo.style.display="block"}renderActions();renderProducts()}
function renderActions(){let u=user();actions.innerHTML=u?`<span class="balance">💎 ${u.diamonds||0}</span><button class="btn menu" onclick="openMenu()">⋮</button>`:`<button class="btn" onclick="show('authModal')">Sign In</button>`}
function renderProducts(){let c=cfg();products.innerHTML=c.products.map((p,i)=>`<article class="card">${p.banner?`<img class="banner" src="${esc(p.banner)}">`:""}${p.youtube?youtube(p.youtube):""}<div class="prodHead">${p.logo?`<img class="logo" src="${esc(p.logo)}">`:""}<div><div class="name" style="font-size:${p.nameSize||22}px">${esc(p.name)}${p.subtitle?`<div class="sub" style="font-size:${Math.max(9,(p.nameSize||22)*.4)}px">${esc(p.subtitle)}</div>`:""}</div></div></div>${p.pills?.length?`<div class="pills">${p.pills.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>`:""}<div>${(p.plans||[]).map((x,j)=>`<div class="plan"><span>${esc(x.name)}</span><span class="price">₹${x.price}</span></div><button class="btn buy" onclick="checkout(${i},${j})">Buy Now</button>`).join("")}</div></article>`).join("")}
function youtube(url){let id=(url.match(/(?:youtu\\.be\\/|v=|shorts\\/)([^?&/]+)/)||[])[1];return id?`<iframe class="video" src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`:""}
let selected=null, finalTotal=0;
function checkout(i,j){selected={i,j};let c=cfg(),p=c.products[i],pl=p.plans[j];document.getElementById("checkoutInfo").innerHTML=`<div class="row"><span>Product</span><b>${esc(p.name)}</b></div><div class="row"><span>Plan</span><b>${esc(pl.name)}</b></div>`;subtotal.textContent="₹"+pl.price;discount.textContent="₹0";total.textContent="₹"+pl.price;finalTotal=pl.price;coupon.value="";renderWallet(pl.price);show("checkout")}
function renderWallet(price){let u=user();walletPay.innerHTML=u&&u.diamonds>=price?`<button class="btn" style="width:100%;margin:10px 0" onclick="payWallet()">Pay via 💎 (${u.diamonds} available)</button>`:""}
function applyCoupon(){let code=coupon.value.trim().toUpperCase(),c=cfg(),x=c.coupons?.find(a=>a.code.toUpperCase()===code),base=selected?c.products[selected.i].plans[selected.j].price:0;if(!x){alert("Invalid coupon");return}let d=x.type==="percent"?base*x.value/100:Math.min(base,x.value);finalTotal=Math.max(0,base-d);discount.textContent="₹"+d.toFixed(2);total.textContent="₹"+finalTotal.toFixed(2);renderWallet(finalTotal)}
function payWallet(){let u=user();if(!u||u.diamonds<finalTotal)return alert("Insufficient diamonds");u.diamonds-=finalTotal;saveUser(u);hide("checkout");renderActions();alert("Purchase successful! 💎")}
function gateway(){let c=cfg();if(!c.zapPayUrl)return alert("ZapPay gateway URL is not configured. Add it in Admin Panel.");let u=new URL(c.zapPayUrl);u.searchParams.set("amount",finalTotal);u.searchParams.set("product",c.products[selected.i].name);u.searchParams.set("plan",c.products[selected.i].plans[selected.j].name);window.location.href=u.toString()}
gatewayBtn.onclick=gateway;
function auth(){let e=email.value.trim(),p=pass.value;if(!e||!p)return alert("Enter email and password");let u=user();if(authTitle.textContent==="Create Account"){u={email:e,diamonds:0};saveUser(u);alert("Account created")}else{if(!u||u.email!==e)return alert("Demo account not found. Create a new account first.");alert("Signed in")}hide("authModal");renderActions()}
function toggleAuth(){let create=authTitle.textContent==="Sign In";authTitle.textContent=create?"Create Account":"Sign In";authSwitch.textContent=create?"Already have an account? Sign In":"Create a new account"}
function openMenu(){let u=user(),v=prompt("Menu:\\n1 = Dashboard\\n2 = Top-up\\n3 = Logout");if(v==="2")topup();if(v==="3"){localStorage.removeItem("nrz_user");renderActions()}}
function topup(){let a=cfg().walletOptions||[5,20,50,100,250,500,1000],x=prompt("Top-up amount (💎):\\n"+a.join(", "));x=Number(x);if(!a.includes(x))return alert("Choose a listed amount.");let c=cfg();if(!c.zapPayUrl)return alert("ZapPay gateway URL is not configured in Admin Panel.");let u=new URL(c.zapPayUrl);u.searchParams.set("amount",x);u.searchParams.set("type","wallet");window.location.href=u.toString()}
function show(id){document.getElementById(id).style.display="flex"}function hide(id){document.getElementById(id).style.display="none"}function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
init();
</script>
</body></html>
