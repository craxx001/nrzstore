rget="_blank" rel="noopener noreferrer" class="inline-flex min-h-8 items-center gap-1 rounded-md border-2 border-border bg-accent px-2 text-[10px] font-bold shadow-[2px_2px_0_0_var(--border)]"><iconify-icon icon="lucide:message-circle" class="text-sm"></iconify-icon>Discord</a><a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-8 items-center gap-1 rounded-md border-2 border-border bg-destructive px-2 text-[10px] font-bold shadow-[2px_2px_0_0_var(--border)]"><iconify-icon icon="lucide:play" class="text-sm"></iconify-icon>YouTube</a></div><p class="mt-3 text-[9px] font-medium text-muted-foreground"><span class="text-destructive">♥</span> Developed with love power - Bhuwan APIs</p></footer></main><script>const apiEndpoints=[{name:'Info api',method:'GET',endpoint:'https://info.bhuwanhex.bond/info?uid={uid}',description:'Get account information using UID.',parameters:['uid']},{name:'jwt api',method:'GET',endpoint:'https://jwt.bhuwanhex.bond/token?uid={uid}&amp;password={password}',description:'Generate JWT information using credentials.',parameters:['uid','password']},{name:'Level info api',method:'GET',endpoint:'https://level-info-api-three.vercel.app/level?uid={uid}&amp;region={region}',description:'Get player level information.',parameters:['uid','region']},{name:'Ban check api',method:'GET',endpoint:'https://ban.bhuwanhex.bond/check?uid={uid}',description:'Check whether an account is banned.',parameters:['uid']},{name:'Duo api',method:'GET',endpoint:'https://premium-duo-api.vercel.app/duo?uid={uid}',description:'Get duo/account related information.',parameters:['uid']},{name:'Outfit api',method:'GET',endpoint:'https://mp.mahihost.uk:9004/outfit-manage?uid={uid}&amp;key=bhuwan',description:'Get outfit information.',parameters:['uid']},{name:'Ban check UID and pass',method:'GET',endpoint:'https://jwt.bhuwanhex.bond/check?uid={uid}&amp;password={password}',description:'Ban check using guest account UID and password shows the exact ban or not.',parameters:['uid','password']},{name:'Guest generate api',method:'GET',endpoint:'https://mp.mahihost.uk:9011/gen?name={USERNAME}&amp;count={NUMBER}&amp;region={REGION}&amp;password_prefix={PREFIX}',description:'Generate a guest account with region and password prefix.',parameters:['username','count','region','prefix']},{name:'Bio api',method:'GET',endpoint:'https://bio-api-bhuwan-tau.vercel.app/update_bio?access_token={YOUR_ACCESS_TOKEN}&amp;bio={your_bio}',description:'Put access token and your bio updates automatically.',parameters:['access_token','bio']}];const list=document.getElementById('apiList');const count=document.getElementById('apiCount');const search=document.getElementById('searchInput');const esc=v=>String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));function card(api,index){const fields=api.parameters.map(p=>`<label class="grid gap-1 text-[9px] font-bold text-muted-foreground">${esc(p)}<input data-param="${esc(p)}" type="${p.includes('password')?'password':'text'}" placeholder="Enter ${esc(p)}" class="min-h-8 rounded-md border border-input bg-card px-2 text-[10px] text-foreground outline-none" /></label>`).join('');return `<article class="rounded-xl border-2 border-border bg-card p-3 shadow-[3px_3px_0_0_var(--border)]" data-index="${index}"><div class="flex items-start justify-between gap-3"><h2 class="text-xs font-heading font-bold">${esc(api.name)}</h2><span class="rounded-md border border-tertiary-foreground bg-tertiary px-1.5 py-0.5 text-[9px] font-black text-tertiary-foreground">${esc(api.method)}</span></div><code class="mt-3 block min-h-10 rounded-md border border-input bg-muted p-2 font-mono text-[9px] leading-tight text-foreground break-all">${esc(api.endpoint)}</code><p class="mt-2 min-h-7 text-[9px] leading-relaxed text-muted-foreground">${esc(api.description)}</p><button class="test-button mt-3 min-h-8 w-full rounded-md border-2 border-border bg-primary px-3 text-[11px] font-black text-primary-foreground shadow-[2px_2px_0_0_var(--border)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none">Test API</button><div class="tester hidden mt-3 rounded-lg border-2 border-dashed border-border bg-muted p-2"><div class="text-[9px] font-black uppercase tracking-wide text-muted-foreground">Demo request</div><code class="mt-1 block rounded-md border border-input bg-card p-2 font-mono text-[8px] leading-tight text-foreground break-all">${esc(api.endpoint)}</code><div class="mt-2 grid gap-2">${fields}</div><button class="send-button mt-2 min-h-8 w-full rounded-md border-2 border-border bg-primary px-3 text-[10px] font-black text-primary-foreground shadow-[2px_2px_0_0_var(--border)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none">Send Request</button><div class="mt-3 flex items-center justify-between"><span class="text-[9px] font-black uppercase tracking-wide text-muted-foreground">Response</span><span class="rounded bg-primary px-1.5 py-0.5 text-[8px] font-black text-primary-foreground">MOCK DEMO</span></div><pre class="result mt-1 max-h-40 overflow-auto rounded-md border border-input bg-foreground p-2 font-mono text-[8px] leading-relaxed text-background whitespace-pre-wrap break-words">Click “Send Request” to generate a demo response.</pre></div></article>`}function render(items){count.textContent=items.length;list.innerHTML=items.length?items.map(a=>card(a,apiEndpoints.indexOf(a))).join(''):'<div class="rounded-xl border-2 border-dashed border-border p-6 text-center text-xs font-bold text-muted-foreground">No API endpoints match your search.</div>'}function mock(api,values){const endpoint=api.endpoint.replace(/\{(\w+)\}/g,(_,k)=>encodeURIComponent(values[k]||'demo_'+k));return {success:true,demo:true,message:'Mock response generated. No live backend request was sent.',method:api.method,endpoint,data:{api_name:api.name,requested_at:new Date().toISOString(),parameters:values,status:'operational'}}}list.addEventListener('click',e=>{const article=e.target.closest('article');if(!article)return;const api=apiEndpoints[Number(article.dataset.index)];if(e.target.closest('.test-button')){const panel=article.querySelector('.tester');panel.classList.toggle('hidden');e.target.textContent=panel.classList.contains('hidden')?'Test API':'Close Tester'}if(e.target.closest('.send-button')){const button=e.target.closest('.send-button');const result=article.querySelector('.result');const values={};article.querySelectorAll('[data-param]').forEach(input=>values[input.dataset.param]=input.value.trim());button.disabled=true;button.textContent='Sending...';result.textContent='Loading demo response...';setTimeout(()=>{result.textContent=JSON.stringify(mock(api,values),null,2);button.disabled=false;button.textContent='Send Request'},450)}});search.addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();render(apiEndpoints.filter(api=>[api.name,api.method,api.endpoint,api.description,api.parameters.join(' ')].join(' ').toLowerCase().includes(q)))});render(apiEndpoints);</script></div>
